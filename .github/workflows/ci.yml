name: Build TrollStore TIPA
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Restore Rime frameworks and schemas
        id: rime-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            Frameworks/*.xcframework
            Frameworks/trollstore-build.json
            Resources/SharedSupport/*.zip
            Resources/SharedSupport/trollstore-schema-build.sha256
          key: rime-ios16-${{ runner.os }}-${{ runner.arch }}-xcode16.4-${{ hashFiles('librimeFramework.sh', 'InputSchemaBuild.sh', 'scripts/build-rime-ios.sh', 'scripts/prepare-rime-source.py', 'scripts/rime-hamster.patch', 'scripts/create-rime-xcframeworks.py', 'scripts/validate-dependencies.py', 'Resources/SharedSupport/hamster.yaml') }}

      - name: Check tools
        run: |
          xcodebuild -version
          command -v cmake || brew install cmake
          bash -n build-tipa.sh librimeFramework.sh InputSchemaBuild.sh scripts/build-rime-ios.sh
          python3 -m unittest discover -s tests -v

      - name: Prepare dependencies
        run: bash ./build-tipa.sh --prepare-only

      - name: Save prepared dependencies
        if: steps.rime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            Frameworks/*.xcframework
            Frameworks/trollstore-build.json
            Resources/SharedSupport/*.zip
            Resources/SharedSupport/trollstore-schema-build.sha256
          key: ${{ steps.rime-cache.outputs.cache-primary-key }}

      - name: Build iOS 16 TrollStore package
        run: bash ./build-tipa.sh --skip-dependencies

      - name: Upload TIPA
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Hamster-ios16-arm64-tipa
          path: |
            artifacts/trollstore/*.tipa
            artifacts/trollstore/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Hamster-build-diagnostics
          path: .build/trollstore/build.*/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
